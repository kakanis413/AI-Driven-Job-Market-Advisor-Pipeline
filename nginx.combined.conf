# Single-container layout: nginx owns $PORT, serves the built SPA, and reverse-proxies
# the API to uvicorn on 127.0.0.1:8000. Same origin for both, so CORS never applies.
server {
    listen 8080;
    server_name _;

    root /var/www/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API -> uvicorn ---
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The advisor streams SSE. Buffering here would hold the whole response and
        # throw away the ~1s time-to-first-token the streaming path exists to deliver.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # Long enough for a full advisor turn; the app's own 30s timeout ends it first.
        proxy_read_timeout 300s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8000/healthz;
        proxy_set_header Host $host;
    }

    # --- static SPA ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
