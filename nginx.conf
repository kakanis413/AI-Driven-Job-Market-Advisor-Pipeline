# Static server for the built Vite bundle on Cloud Run.
server {
    # Cloud Run always sends traffic to $PORT; the frontend service pins PORT=8080
    # so this can be a literal and nginx needs no envsubst pass at boot.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints these filenames, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy leaves browsers pointing at
    # asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
